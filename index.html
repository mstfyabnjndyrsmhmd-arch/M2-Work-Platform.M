<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>M2 Work Platform</title>
<style>
body{margin:0;background:#111827;color:white;font-family:Arial;text-align:center}
.box{max-width:400px;margin:70px auto;padding:30px;background:#1f2937;border-radius:20px}
.logo{font-size:55px;font-weight:bold;color:#38bdf8}
input,button{width:90%;padding:14px;margin:10px 0;border:0;border-radius:10px;box-sizing:border-box}
button{background:#2563eb;color:white;font-size:17px}
.lang{background:#374151}
</style>
</head>
<body>
<div class="box">
<div class="logo">M2</div>
<h1>منصة M2 للعمل</h1>
<input type="email" placeholder="البريد الإلكتروني">
<input type="password" placeholder="كلمة المرور">
<input type="text" placeholder="كود الدعوة">
<button>تسجيل الدخول</button>
<button class="lang">English</button>
<p>ليس لديك حساب؟ إنشاء حساب</p>
</div>
</body>
</html>
